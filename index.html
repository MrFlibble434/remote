<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automato Wireless Remote Console</title>
  <style>
    html { font-family: Arial, sans-serif; text-align: center; background: #0b0f12; color: #f5f5f5; min-height: 100%; }
    body { max-width: 450px; margin: 0 auto; padding: 30px 15px; }
    h2 { color: #81c784; margin-bottom: 5px; }
    .console-card { background: #11161b; padding: 25px; border-radius: 12px; border: 1px solid #1f282e; margin-bottom: 15px; text-align: left; }
    .label { font-size: 11px; text-transform: uppercase; color: #81c784; font-weight: bold; margin-bottom: 4px; }
    .val { font-size: 24px; font-weight: bold; margin-bottom: 15px; color: #fff; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    button { background: #1b232a; border: 1px solid #2d3941; padding: 16px; color: #fff; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    button:active { background: #2e7d32; border-color: #81c784; }
    .stop-btn { grid-column: span 2; background: #c62828; border-color: #e57373; }
    .stop-btn:active { background: #b71c1c; }
    #statusLine { font-size: 13px; color: #4fc3f7; text-align: center; font-weight: bold; margin-top: 10px; }
    .login-cover { background: #11161b; padding: 30px; border-radius: 12px; border: 1px solid #1f282e; }
    input { width: 100%; padding: 14px; background: #1c252c; border: 1px solid #2d3941; border-radius: 6px; color: #fff; font-size: 16px; margin: 10px 0 20px 0; box-sizing: border-box; }
  </style>
  <script src="https://cloudflare.com"></script>
</head>
<body>

  <h2>Automato Greenhouse</h2>
  <p style="color:#607d8b; font-size:13px; margin-top:0;">Global Live Telemetry Network Link</p>

  <!-- Access Shield Gate -->
  <div class="login-cover" id="loginCard">
    <div class="label">System Shield Password</div>
    <input type="password" id="passInput" placeholder="Enter device password">
    <button style="width:100%; background:#2e7d32; border:none;" onclick="startGlobalPipeline()">Connect over 4G/5G</button>
  </div>

  <!-- Operational Panel (Hidden until sync pass connects) -->
  <div id="controlPanel" style="display:none;">
    <div class="console-card">
      <div class="label">Greenhouse Air Temp</div>
      <div class="val" id="uiTemp">--.-°C</div>
      <div class="label">Battery Cell Volts</div>
      <div class="val" id="uiVolts">--.--V</div>
      <div class="label">Mechanical Drive State</div>
      <div id="uiState" style="font-weight:bold; color:#4fc3f7;">SYNCHRONISING...</div>
    </div>

    <button class="stop-btn" onclick="sendControl('STOP')">EMERGENCY MOTOR STOP</button>
    <div class="btn-grid">
      <button onclick="sendControl('FORWARD')">DRIVE OPEN</button>
      <button onclick="sendControl('REVERSE')">DRIVE CLOSE</button>
      <button onclick="sendControl('AUTO')" style="background:#2e7d32;">AUTO MODE</button>
      <button onclick="sendControl('MANUAL')">MANUAL MODE</button>
    </div>
  </div>

  <div id="statusLine">System initialization pending...</div>

  <script>
    let globalClient = null; let cmdTopic = ""; let statTopic = "";

    function startGlobalPipeline() {
      const p = document.getElementById("passInput").value.trim();
      const status = document.getElementById("statusLine");
      if(!p) return alert("Please supply the administrative sync key!");

      status.innerHTML = "Opening native unblockable WebSocket text socket...";
      
      // Target the public cloud cluster row over secure sockets directly
      globalClient = mqtt.connect("wss://://hivemq.com");
      
      // Calculate hash match headers instantly inside your browser engine
      const secureHash = btoa(p).substring(0,8);
      cmdTopic = "automato/greenhouse_" + secureHash + "/cmd";
      statTopic = "automato/greenhouse_" + secureHash + "/status";

      globalClient.on('connect', () => {
        status.innerHTML = "Handshake verified! Intercepting live device bytes...";
        globalClient.subscribe(statTopic);
      });

      globalClient.on('message', (topic, payload) => {
        if(topic === statTopic) {
          status.innerHTML = "Global connection link: rock-solid.";
          document.getElementById("loginCard").style.display = "none";
          document.getElementById("controlPanel").style.display = "block";
          
          const data = JSON.parse(payload.toString());
          document.getElementById("uiTemp").innerHTML = data.temp.toFixed(1) + "°C";
          document.getElementById("uiVolts").innerHTML = data.volts.toFixed(2) + "V";
          document.getElementById("uiState").innerHTML = data.shade_pos;
        }
      });
    }

    function sendControl(command) {
      if(globalClient && globalClient.connected) {
        globalClient.publish(cmdTopic, command);
        document.getElementById("statusLine").innerHTML = "Command [" + command + "] dispatched across grid.";
      }
    }
  </script>
</body>
</html>
