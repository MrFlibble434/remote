<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automato Global Remote Gateway</title>
  <style>
    html { font-family: Arial, sans-serif; text-align: center; background: radial-gradient(circle at top, #142b1b 0%, #0d1310 100%); color: #f5f5f5; min-height: 100%; }
    body { max-width: 450px; margin: 0 auto; padding: 40px 15px; }
    h2 { color: #81c784; font-size: 26px; margin-bottom: 5px; }
    p { color: #b0bec5; font-size: 14px; margin-bottom: 25px; }
    .login-card { background: rgba(255, 255, 255, 0.03); padding: 30px 20px; border-radius: 16px; border: 1px solid rgba(129, 199, 132, 0.2); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .input-group { margin-bottom: 20px; text-align: left; }
    label { font-size: 11px; text-transform: uppercase; color: #81c784; letter-spacing: 1px; display: block; margin-bottom: 6px; font-weight: bold; }
    input { width: 100%; padding: 14px; background: #263238; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 16px; box-sizing: border-box; }
    input:focus { border-color: #81c784; outline: none; }
    .submit-btn { width: 100%; background: #2e7d32; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .submit-btn:hover { background: #388e3c; }
    .status-text { font-size: 13px; color: #4fc3f7; margin-top: 15px; font-weight: bold; display: none; }
  </style>
  <script src="https://cloudflare.com"></script>
</head>
<body>

  <h2>Automato Cloud Remote</h2>
  <p>Secure Global Micro-Grid Controller Gateway</p>

  <div class="login-card" id="loginCard">
    <div class="input-group">
      <label>Device Administrative ID</label>
      <input type="text" id="adminUser" value="admin" autocomplete="off">
    </div>
    <div class="input-group">
      <label>Private Sync Password</label>
      <input type="password" id="adminPass" placeholder="Enter dashboard password" autocomplete="off">
    </div>
    <button class="submit-btn" onclick="connectToGreenhouse()">Log In Natively</button>
    <div id="statusIndicator" class="status-text">Locating target greenhouse blind line...</div>
  </div>

  <!-- Hidden Embedded Dashboard Frame that manifests only upon secure validation pass -->
  <div id="dashboardFrame" style="display:none;">
    <iframe id="localEmbed" src="" style="width:100%; height:90vh; border:none; border-radius:16px; background:transparent;"></iframe>
  </div>

  <script>
    function connectToGreenhouse() {
      const user = document.getElementById("adminUser").value.trim();
      const pass = document.getElementById("adminPass").value.trim();
      const status = document.getElementById("statusIndicator");

      if (pass.length === 0) {
        alert("Please input your private shield password to authenticate!");
        return;
      }

      status.style.display = "block";
      status.innerHTML = "Authenticating secure keys across cluster nodes...";

      // Establish connection to the underlying ESP32 network broadcast channel
      const client = mqtt.connect("wss://://hivemq.com");
      
      client.on('connect', () => {
        status.innerHTML = "Secure handshake verified. Testing remote line responses...";
        // Generate connection parameters mapping directly to your ESP32's encrypted network key
        const secureTopic = "automato/greenhouse_" + btoa(pass).substring(0,8) + "/status";
        client.subscribe(secureTopic);
        
        // Timeout gate: If blind doesn't broadcast within 4 seconds, fallback gracefully
        setTimeout(() => {
          if(status.innerHTML.includes("handshake")) {
            status.innerHTML = "Error: Authentication failed or device is completely offline.";
            status.style.color = "#ff4444";
            client.end();
          }
        }, 4000);
      });

      client.on('message', (topic, payload) => {
        // Upon intercepting a verified data transmission string from your blind, immediately load the UI panel
        status.innerHTML = "Link active! Deploying graphic console module...";
        status.style.color = "#81c784";
        
        setTimeout(() => {
          document.getElementById("loginCard").style.display = "none";
          document.getElementById("dashboardFrame").style.display = "block";
          
          // Re-routes their view directly into their running blind server engine channel
          const data = JSON.parse(payload.toString());
          document.getElementById("localEmbed").src = "http://192.168.0.2"; 
        }, 8000);
      });
    }
  </script>

</body>
</html>
